- name: Media
  slug: media
  columns:
    - size: small
      widgets:
      - type: custom-api
        title: Library Summary
        cache: 5m
        url: http://192.168.40.11:7878/api/v3/movie
        headers:
          X-Api-Key: "${GLANCE_RADARR_KEY}"
        template: |
          {{ $movies := len (.JSON.Array "") }}
          {{ $totalBytes := 0.0 }}{{ $monitored := 0 }}{{ $available := 0 }}
          {{ range .JSON.Array "" }}
          {{ $totalBytes = add $totalBytes (.Float "sizeOnDisk") }}
          {{ if .Bool "monitored" }}{{ $monitored = add $monitored 1 }}{{ end }}
          {{ if .Bool "hasFile" }}{{ $available = add $available 1 }}{{ end }}
          {{ end }}
          {{ $tb := div $totalBytes 1099511627776.0 }}
          <div style="background: rgba(245,158,11,0.08); border-left: 3px solid #f59e0b; border-radius: 10px; padding: 14px; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-size: 11px; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;">🎬 Movies</span>
              <span style="font-size: 10px; color: #94a3b8;">{{ $available }} / {{ $movies }}</span>
            </div>
            <div style="font-size: 26px; color: #fff; font-weight: 700;">{{ printf "%.2f" $tb }}<span style="font-size: 12px; color: #94a3b8; margin-left: 4px;">TB</span></div>
            <div style="font-size: 10px; color: #888; margin-top: 4px;">{{ $monitored }} monitored · {{ sub $movies $available }} missing</div>
          </div>
      - type: custom-api
        title: TV Library
        cache: 5m
        url: http://192.168.40.11:8989/api/v3/series
        headers:
          X-Api-Key: "${GLANCE_SONARR_KEY}"
        template: |
          {{ $series := len (.JSON.Array "") }}
          {{ $totalBytes := 0.0 }}{{ $monitored := 0 }}{{ $epAvailable := 0 }}{{ $epTotal := 0 }}
          {{ range .JSON.Array "" }}
          {{ $totalBytes = add $totalBytes (.Float "statistics.sizeOnDisk") }}
          {{ if .Bool "monitored" }}{{ $monitored = add $monitored 1 }}{{ end }}
          {{ $epAvailable = add $epAvailable (.Int "statistics.episodeFileCount") }}
          {{ $epTotal = add $epTotal (.Int "statistics.episodeCount") }}
          {{ end }}
          {{ $tb := div $totalBytes 1099511627776.0 }}
          <div style="background: rgba(139,92,246,0.08); border-left: 3px solid #8b5cf6; border-radius: 10px; padding: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-size: 11px; color: #a78bfa; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;">📺 TV Series</span>
              <span style="font-size: 10px; color: #94a3b8;">{{ $series }} shows</span>
            </div>
            <div style="font-size: 26px; color: #fff; font-weight: 700;">{{ printf "%.2f" $tb }}<span style="font-size: 12px; color: #94a3b8; margin-left: 4px;">TB</span></div>
            <div style="font-size: 10px; color: #888; margin-top: 4px;">{{ $epAvailable }} / {{ $epTotal }} episodes · {{ $monitored }} monitored</div>
          </div>
      - type: custom-api
        title: NAS Media Storage
        cache: 2m
        url: http://192.168.40.11:7878/api/v3/diskspace
        headers:
          X-Api-Key: "${GLANCE_RADARR_KEY}"
        template: |
          {{ $found := false }}{{ $free := 0.0 }}{{ $total := 0.0 }}
          {{ range .JSON.Array "" }}
          {{ if eq (.String "path") "/movies" }}
          {{ $found = true }}{{ $free = .Float "freeSpace" }}{{ $total = .Float "totalSpace" }}
          {{ end }}
          {{ end }}
          {{ $used := sub $total $free }}
          {{ $pct := 0.0 }}{{ if gt $total 0.0 }}{{ $pct = div (mul $used 100.0) $total }}{{ end }}
          {{ $usedTB := div $used 1099511627776.0 }}
          {{ $totalTB := div $total 1099511627776.0 }}
          <div style="background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px;">
            <div style="font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;">NAS · Proxmox-Media</div>
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
              <span style="font-size: 18px; color: #fff; font-weight: 700;">{{ printf "%.1f" $usedTB }}<span style="font-size: 10px; color: #94a3b8; margin-left: 3px;">TB</span></span>
              <span style="font-size: 11px; color: {{ if lt $pct 70.0 }}#22c55e{{ else if lt $pct 90.0 }}#f59e0b{{ else }}#ef4444{{ end }}; font-weight: 600;">{{ printf "%.1f" $pct }}%</span>
            </div>
            <div style="background: rgba(255,255,255,0.08); border-radius: 4px; height: 6px; overflow: hidden;">
              <div style="background: {{ if lt $pct 70.0 }}#22c55e{{ else if lt $pct 90.0 }}#f59e0b{{ else }}#ef4444{{ end }}; height: 6px; width: {{ printf "%.1f" $pct }}%;"></div>
            </div>
            <div style="font-size: 10px; color: #888; margin-top: 4px;">{{ printf "%.1f" (div $free 1099511627776.0) }} TB free of {{ printf "%.1f" $totalTB }} TB</div>
          </div>
      - type: monitor
        title: Service Status
        cache: 1m
        sites:
        - title: Sonarr
          url: http://192.168.40.11:8989/ping
          icon: si:sonarr
        - title: Radarr
          url: http://192.168.40.11:7878/ping
          icon: si:radarr
        - title: Jellyfin
          url: http://192.168.40.11:8096/health
          icon: si:jellyfin
        - title: Prowlarr
          url: http://192.168.40.11:9696/ping
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/prowlarr.png
        - title: Deluge
          url: http://192.168.40.11:8112
          icon: si:deluge
        - title: SABnzbd
          url: http://192.168.40.11:8081
          icon: si:sabnzbd
      - type: bookmarks
        title: Quick Links
        groups:
        - title: Apps
          links:
          - title: Jellyfin
            url: https://jellyfin.hrmsmrflrii.xyz
            icon: si:jellyfin
          - title: Jellyseerr
            url: https://jellyseerr.hrmsmrflrii.xyz
            icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/jellyseerr.png
          - title: Sonarr
            url: https://sonarr.hrmsmrflrii.xyz
            icon: si:sonarr
          - title: Radarr
            url: https://radarr.hrmsmrflrii.xyz
            icon: si:radarr
          - title: Prowlarr
            url: https://prowlarr.hrmsmrflrii.xyz
            icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/prowlarr.png
          - title: Bazarr
            url: https://bazarr.hrmsmrflrii.xyz
            icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/bazarr.png
        - title: Downloads
          links:
          - title: Deluge
            url: https://deluge.hrmsmrflrii.xyz
            icon: si:deluge
          - title: SABnzbd
            url: https://sabnzbd.hrmsmrflrii.xyz
            icon: si:sabnzbd
          - title: MeTube
            url: https://metube.hrmsmrflrii.xyz
            icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/metube.png
          - title: Tdarr
            url: https://tdarr.hrmsmrflrii.xyz
            icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/tdarr.png
    - size: full
      widgets:
      - type: custom-api
        title: Currently Downloading
        cache: 30s
        url: http://192.168.40.11:8989/api/v3/queue?pageSize=50&includeUnknownSeriesItems=true
        headers:
          X-Api-Key: "${GLANCE_SONARR_KEY}"
        template: |
          {{ $sonarrCount := .JSON.Int "totalRecords" }}
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 2px;">
            <span style="font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.06em;">Sonarr Queue</span>
            <span style="font-size: 10px; color: #94a3b8;"><span style="color: #8b5cf6; font-weight: 600;">{{ $sonarrCount }}</span> items</span>
          </div>
          {{ if eq $sonarrCount 0 }}
          <div style="text-align: center; color: #666; font-style: italic; padding: 20px;">No TV downloads queued</div>
          {{ else }}
          <div style="display: flex; flex-direction: column; gap: 8px;">
            {{ range .JSON.Array "records" }}
            {{ $size := .Float "size" }}{{ $left := .Float "sizeleft" }}
            {{ $pct := 0.0 }}{{ if gt $size 0.0 }}{{ $pct = div (mul (sub $size $left) 100.0) $size }}{{ end }}
            {{ $statusColor := "#94a3b8" }}
            {{ if eq (.String "status") "completed" }}{{ $statusColor = "#22c55e" }}{{ end }}
            {{ if eq (.String "status") "downloading" }}{{ $statusColor = "#3b82f6" }}{{ end }}
            {{ if eq (.String "status") "warning" }}{{ $statusColor = "#f59e0b" }}{{ end }}
            {{ if eq (.String "trackedDownloadStatus") "warning" }}{{ $statusColor = "#f59e0b" }}{{ end }}
            <div style="background: rgba(255,255,255,0.04); border-left: 3px solid {{ $statusColor }}; border-radius: 8px; padding: 10px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="font-size: 11px; color: #fff; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">
                  <span style="font-size: 8px; color: #8b5cf6; background: rgba(139,92,246,0.15); padding: 1px 5px; border-radius: 3px; margin-right: 6px;">TV</span>
                  {{ .String "title" }}
                </span>
                <span style="font-size: 10px; color: {{ $statusColor }}; font-weight: 600; text-transform: uppercase;">{{ .String "status" }}</span>
              </div>
              <div style="background: rgba(255,255,255,0.08); border-radius: 4px; height: 5px; overflow: hidden;">
                <div style="background: {{ $statusColor }}; height: 5px; width: {{ printf "%.1f" $pct }}%;"></div>
              </div>
              <div style="display: flex; justify-content: space-between; margin-top: 4px;">
                <span style="font-size: 9px; color: #888;">{{ printf "%.1f" (div $size 1073741824.0) }} GB · {{ .String "protocol" }}</span>
                <span style="font-size: 9px; color: #94a3b8;">{{ printf "%.1f" $pct }}%</span>
              </div>
            </div>
            {{ end }}
          </div>
          {{ end }}
      - type: custom-api
        title: Movie Queue (Radarr)
        cache: 30s
        url: http://192.168.40.11:7878/api/v3/queue?pageSize=50
        headers:
          X-Api-Key: "${GLANCE_RADARR_KEY}"
        template: |
          {{ $radarrCount := .JSON.Int "totalRecords" }}
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 2px;">
            <span style="font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.06em;">Radarr Queue</span>
            <span style="font-size: 10px; color: #94a3b8;"><span style="color: #f59e0b; font-weight: 600;">{{ $radarrCount }}</span> items</span>
          </div>
          {{ if eq $radarrCount 0 }}
          <div style="text-align: center; color: #666; font-style: italic; padding: 20px;">No movie downloads queued</div>
          {{ else }}
          <div style="display: flex; flex-direction: column; gap: 8px;">
            {{ range .JSON.Array "records" }}
            {{ $size := .Float "size" }}{{ $left := .Float "sizeleft" }}
            {{ $pct := 0.0 }}{{ if gt $size 0.0 }}{{ $pct = div (mul (sub $size $left) 100.0) $size }}{{ end }}
            {{ $statusColor := "#94a3b8" }}
            {{ if eq (.String "status") "completed" }}{{ $statusColor = "#22c55e" }}{{ end }}
            {{ if eq (.String "status") "downloading" }}{{ $statusColor = "#3b82f6" }}{{ end }}
            {{ if eq (.String "status") "warning" }}{{ $statusColor = "#f59e0b" }}{{ end }}
            {{ if eq (.String "trackedDownloadStatus") "warning" }}{{ $statusColor = "#f59e0b" }}{{ end }}
            <div style="background: rgba(255,255,255,0.04); border-left: 3px solid {{ $statusColor }}; border-radius: 8px; padding: 10px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="font-size: 11px; color: #fff; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">
                  <span style="font-size: 8px; color: #f59e0b; background: rgba(245,158,11,0.15); padding: 1px 5px; border-radius: 3px; margin-right: 6px;">MOVIE</span>
                  {{ .String "title" }}
                </span>
                <span style="font-size: 10px; color: {{ $statusColor }}; font-weight: 600; text-transform: uppercase;">{{ .String "status" }}</span>
              </div>
              <div style="background: rgba(255,255,255,0.08); border-radius: 4px; height: 5px; overflow: hidden;">
                <div style="background: {{ $statusColor }}; height: 5px; width: {{ printf "%.1f" $pct }}%;"></div>
              </div>
              <div style="display: flex; justify-content: space-between; margin-top: 4px;">
                <span style="font-size: 9px; color: #888;">{{ printf "%.1f" (div $size 1073741824.0) }} GB · {{ .String "protocol" }}</span>
                <span style="font-size: 9px; color: #94a3b8;">{{ printf "%.1f" $pct }}%</span>
              </div>
            </div>
            {{ end }}
          </div>
          {{ end }}
      - type: custom-api
        title: Recently Added — TV
        cache: 5m
        url: http://192.168.40.11:8989/api/v3/history?pageSize=12&eventType=3&sortKey=date&sortDirection=descending
        headers:
          X-Api-Key: "${GLANCE_SONARR_KEY}"
        template: |
          {{ $count := .JSON.Int "totalRecords" }}
          {{ if eq $count 0 }}
          <div style="text-align: center; color: #666; font-style: italic; padding: 20px;">No recent imports</div>
          {{ else }}
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
            {{ range .JSON.Array "records" }}
            <div style="background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px;">
              <div style="font-size: 11px; color: #fff; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px;">
                <span style="font-size: 8px; color: #8b5cf6; background: rgba(139,92,246,0.15); padding: 1px 4px; border-radius: 3px; margin-right: 5px;">TV</span>
                {{ .String "sourceTitle" }}
              </div>
              <div style="font-size: 9px; color: #888;">{{ .String "date" }}</div>
            </div>
            {{ end }}
          </div>
          {{ end }}
      - type: rss
        title: Movie & TV News
        collapse-after: 3
        limit: 8
        feeds:
        - title: Deadline
          url: https://deadline.com/feed/
        - title: Variety
          url: https://variety.com/feed/
    - size: small
      widgets:
      - type: custom-api
        title: Indexer Health
        cache: 1m
        url: http://192.168.40.11:9696/api/v1/indexerstatus
        headers:
          X-Api-Key: "${GLANCE_PROWLARR_KEY}"
        template: |
          {{ $total := len (.JSON.Array "") }}
          {{ $failing := 0 }}
          {{ range .JSON.Array "" }}{{ if .String "disabledTill" }}{{ $failing = add $failing 1 }}{{ end }}{{ end }}
          <div style="background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
              <span style="font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em;">Failing Indexers</span>
              <span style="font-size: 22px; color: {{ if eq $failing 0 }}#22c55e{{ else }}#ef4444{{ end }}; font-weight: 700;">{{ $failing }}</span>
            </div>
            <div style="font-size: 10px; color: #888;">{{ $total }} indexers tracked by Prowlarr</div>
          </div>
          {{ range .JSON.Array "" }}
          {{ if .String "disabledTill" }}
          <div style="background: rgba(239,68,68,0.08); border-left: 3px solid #ef4444; border-radius: 8px; padding: 8px; margin-bottom: 6px;">
            <div style="font-size: 10px; color: #fff; font-weight: 600;">Indexer #{{ .Int "indexerId" }}</div>
            <div style="font-size: 9px; color: #f87171; margin-top: 2px;">{{ .String "mostRecentFailure" }}</div>
          </div>
          {{ end }}
          {{ end }}
      - type: custom-api
        title: Sonarr Alerts
        cache: 2m
        url: http://192.168.40.11:8989/api/v3/health
        headers:
          X-Api-Key: "${GLANCE_SONARR_KEY}"
        template: |
          {{ $count := len (.JSON.Array "") }}
          {{ if eq $count 0 }}
          <div style="background: rgba(34,197,94,0.08); border-left: 3px solid #22c55e; border-radius: 8px; padding: 12px;">
            <div style="font-size: 11px; color: #fff; font-weight: 600;">✓ Sonarr healthy</div>
            <div style="font-size: 10px; color: #94a3b8; margin-top: 2px;">No issues</div>
          </div>
          {{ else }}
          {{ range .JSON.Array "" }}
          {{ $color := "#f59e0b" }}{{ if eq (.String "type") "error" }}{{ $color = "#ef4444" }}{{ end }}
          <div style="background: rgba(255,255,255,0.04); border-left: 3px solid {{ $color }}; border-radius: 8px; padding: 10px; margin-bottom: 6px;">
            <div style="font-size: 9px; color: {{ $color }}; text-transform: uppercase; font-weight: 600;">{{ .String "type" }}</div>
            <div style="font-size: 10px; color: #fff; margin-top: 3px;">{{ .String "message" }}</div>
          </div>
          {{ end }}
          {{ end }}
      - type: custom-api
        title: Radarr Alerts
        cache: 2m
        url: http://192.168.40.11:7878/api/v3/health
        headers:
          X-Api-Key: "${GLANCE_RADARR_KEY}"
        template: |
          {{ $count := len (.JSON.Array "") }}
          {{ if eq $count 0 }}
          <div style="background: rgba(34,197,94,0.08); border-left: 3px solid #22c55e; border-radius: 8px; padding: 12px;">
            <div style="font-size: 11px; color: #fff; font-weight: 600;">✓ Radarr healthy</div>
            <div style="font-size: 10px; color: #94a3b8; margin-top: 2px;">No issues</div>
          </div>
          {{ else }}
          {{ range .JSON.Array "" }}
          {{ $color := "#f59e0b" }}{{ if eq (.String "type") "error" }}{{ $color = "#ef4444" }}{{ end }}
          <div style="background: rgba(255,255,255,0.04); border-left: 3px solid {{ $color }}; border-radius: 8px; padding: 10px; margin-bottom: 6px;">
            <div style="font-size: 9px; color: {{ $color }}; text-transform: uppercase; font-weight: 600;">{{ .String "type" }}</div>
            <div style="font-size: 10px; color: #fff; margin-top: 3px;">{{ .String "message" }}</div>
          </div>
          {{ end }}
          {{ end }}
