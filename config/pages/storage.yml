    - size: small
      widgets:
      - type: custom-api
        title: RAID Volumes
        cache: 1m
        url: http://192.168.40.16:8790/api/nas
        headers:
          X-Labfeed-Token: ${LABFEED_TOKEN}
        template: |
          <div class="lf-list">
            {{ range .JSON.Array "raids" }}
            <div class="lf-card lf-{{ .String "state" }}">
              <div class="lf-card-head"><span class="lf-card-title">{{ .String "name" }}</span><span class="lf-pill">{{ .String "status" }}</span></div>
              {{ if .Bool "is_volume" }}
              <div class="lf-kv"><span>Used</span><b>{{ printf "%.1f" (.Float "used_tb") }} / {{ printf "%.1f" (.Float "total_tb") }} TB · {{ printf "%.0f" (.Float "used_pct") }}%</b></div>
              <div class="lf-bar"><i style="width: {{ .Float "used_pct" }}%"></i></div>
              {{ else }}
              <div class="lf-kv"><span>Pool size</span><b>{{ printf "%.1f" (.Float "total_tb") }} TB · fully allocated</b></div>
              {{ end }}
            </div>
            {{ end }}
          </div>
      - type: custom-api
        title: Proxmox Storage Pools (Aggregate)
        cache: 30s
        url: https://proxmox.hrmsmrflrii.xyz/api2/json/cluster/resources?type=storage
        headers:
          Authorization: "${GLANCE_PVE_AUTH}"
        template: |
          {{ $lvU := 0.0 }}{{ $lvM := 0.0 }}{{ $lvN := 0 }}
          {{ $vmU := 0.0 }}{{ $vmM := 0.0 }}{{ $vmN := 0 }}
          {{ $pdU := 0.0 }}{{ $pdM := 0.0 }}{{ $pdN := 0 }}
          {{ range .JSON.Array "data" }}
            {{ $s := .String "storage" }}
            {{ if eq $s "local-lvm" }}{{ $lvU = add $lvU (.Float "disk") }}{{ $lvM = add $lvM (.Float "maxdisk") }}{{ $lvN = add $lvN 1 }}{{ end }}
            {{ if eq $s "VMDisks" }}{{ $vmU = add $vmU (.Float "disk") }}{{ $vmM = add $vmM (.Float "maxdisk") }}{{ $vmN = add $vmN 1 }}{{ end }}
            {{ if eq $s "ProxmoxData" }}{{ $pdU = add $pdU (.Float "disk") }}{{ $pdM = add $pdM (.Float "maxdisk") }}{{ $pdN = add $pdN 1 }}{{ end }}
          {{ end }}
          <div style="padding: 4px;">
            {{ if gt $lvM 0.0 }}{{ $pct := div (mul $lvU 100.0) $lvM }}<div style="margin-bottom: 10px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span style="font-size: 11px; color: #d1d5db; font-weight: 600;">local-lvm</span><span style="font-size: 10px; color: #94a3b8;">{{ printf "%.0f" (div $lvU 1073741824.0) }} / {{ printf "%.0f" (div $lvM 1073741824.0) }} GB</span></div><div style="background: rgba(255,255,255,0.08); border-radius: 4px; height: 6px; overflow: hidden;"><div style="background: {{ if lt $pct 70.0 }}#22c55e{{ else if lt $pct 90.0 }}#f59e0b{{ else }}#ef4444{{ end }}; height: 6px; width: {{ printf "%.1f" $pct }}%;"></div></div><div style="display: flex; justify-content: space-between; margin-top: 2px;"><span style="font-size: 9px; color: #666;">{{ $lvN }} nodes</span><span style="font-size: 9px; color: #94a3b8;">{{ printf "%.1f" $pct }}%</span></div></div>{{ end }}
            {{ if gt $vmM 0.0 }}{{ $pct := div (mul $vmU 100.0) $vmM }}<div style="margin-bottom: 10px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span style="font-size: 11px; color: #d1d5db; font-weight: 600;">VMDisks</span><span style="font-size: 10px; color: #94a3b8;">{{ printf "%.0f" (div $vmU 1073741824.0) }} / {{ printf "%.0f" (div $vmM 1073741824.0) }} GB</span></div><div style="background: rgba(255,255,255,0.08); border-radius: 4px; height: 6px; overflow: hidden;"><div style="background: {{ if lt $pct 70.0 }}#22c55e{{ else if lt $pct 90.0 }}#f59e0b{{ else }}#ef4444{{ end }}; height: 6px; width: {{ printf "%.1f" $pct }}%;"></div></div><div style="display: flex; justify-content: space-between; margin-top: 2px;"><span style="font-size: 9px; color: #666;">{{ $vmN }} nodes</span><span style="font-size: 9px; color: #94a3b8;">{{ printf "%.1f" $pct }}%</span></div></div>{{ end }}
            {{ if gt $pdM 0.0 }}{{ $pct := div (mul $pdU 100.0) $pdM }}<div style="margin-bottom: 10px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span style="font-size: 11px; color: #d1d5db; font-weight: 600;">ProxmoxData</span><span style="font-size: 10px; color: #94a3b8;">{{ printf "%.0f" (div $pdU 1073741824.0) }} / {{ printf "%.0f" (div $pdM 1073741824.0) }} GB</span></div><div style="background: rgba(255,255,255,0.08); border-radius: 4px; height: 6px; overflow: hidden;"><div style="background: {{ if lt $pct 70.0 }}#22c55e{{ else if lt $pct 90.0 }}#f59e0b{{ else }}#ef4444{{ end }}; height: 6px; width: {{ printf "%.1f" $pct }}%;"></div></div><div style="display: flex; justify-content: space-between; margin-top: 2px;"><span style="font-size: 9px; color: #666;">{{ $pdN }} nodes</span><span style="font-size: 9px; color: #94a3b8;">{{ printf "%.1f" $pct }}%</span></div></div>{{ end }}
          </div>
